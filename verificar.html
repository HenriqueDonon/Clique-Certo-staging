<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clique Certo · Verificar certificado</title>
<style>:root{--ink:#1c2430;--h:#13233a;--mute:#5c6775;--line:#dde1e7;--ok:#15803d;--bad:#b42318}body{margin:0;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;background:#f4f5f7;color:var(--ink);padding:16px}main{max-width:560px;margin:24px auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:24px;display:grid;gap:10px}h1{font-size:1.25rem;margin:0;color:var(--h)}input{font:inherit;padding:12px;border:1px solid #b9c1cc;border-radius:4px;text-transform:uppercase}button{font:inherit;font-weight:700;padding:12px;border:0;border-radius:4px;background:#1f4e8c;color:#fff;cursor:pointer}.ok{color:var(--ok)}.err{color:var(--bad)}dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;border-top:1px solid var(--line);padding-top:10px}dt{color:var(--mute)}dd{margin:0;font-weight:700}</style></head>
<body><main><h1>Clique Certo · Verificar certificado</h1><p style="color:var(--mute);margin:0">Digite o código impresso no certificado (ex.: CC-ABCD-EFGH).</p>
<input id="cod" maxlength="14" autocomplete="off"><button id="ver">Verificar</button><div id="out" role="status"></div></main>
<script src="config.js"></script>
<script type="module">
const FBS={prod:{apiKey:'AIzaSyAnhxp6ZFClK444gO7H9agTDz7w01-vy1Y',authDomain:'clique-certo-4d160.firebaseapp.com',projectId:'clique-certo-4d160',appId:'1:676633305699:web:ea943d4e80d3e1d411ce56'},staging:{apiKey:'AIzaSyAAgrLJOAOPwo10EiviKmTbNJuhrmn08L0',authDomain:'clique-certo-staging-18f27.firebaseapp.com',projectId:'clique-certo-staging-18f27',appId:'1:114147569148:web:bc7237b215285a6ac81679'}};
const ENV=window.CC_ENV||(/\/Clique-Certo\/(verificar\.html)?$/i.test(location.pathname)&&/github\.io$/.test(location.hostname)?'prod':'staging');
const APPCHECK=(window.CC_CONFIG&&window.CC_CONFIG.appCheck)||{prod:'',staging:''};
const G='https://www.gstatic.com/firebasejs/10.12.2/';const [{initializeApp},F]=await Promise.all([import(G+'firebase-app.js'),import(G+'firebase-firestore.js')]);
const app=initializeApp(FBS[ENV]),db=F.getFirestore(app);
if(APPCHECK[ENV]&&!window.__EMU){try{const AC=await import(G+'firebase-app-check.js');AC.initializeAppCheck(app,{provider:new AC.ReCaptchaV3Provider(APPCHECK[ENV]),isTokenAutoRefreshEnabled:true});}catch(e){}}
if(window.__EMU)F.connectFirestoreEmulator(db,'127.0.0.1',8080);
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function ver(){const c=$('#cod').value.trim().toUpperCase().replace(/\s/g,''),o=$('#out');if(!/^CC-[A-Z2-9]{4}-[A-Z2-9]{4}$/.test(c)){o.innerHTML='<p class="err">Código em formato inválido.</p>';return;}
 o.textContent='Verificando...';try{const d=await F.getDoc(F.doc(db,'certificados',c));if(!d.exists()){o.innerHTML='<p class="err">Certificado não encontrado. Confira o código.</p>';return;}const x=d.data();
 if(x.tipo==='funcionario'){o.innerHTML='<p class="ok"><b>✓ Certificado válido</b></p><dl><dt>Tipo</dt><dd>Certificado individual de conclusão</dd><dt>Nome</dt><dd>'+esc(x.nome)+'</dd><dt>Treinamento</dt><dd>Conscientização em Segurança Digital — '+esc(x.nivel)+'</dd><dt>Empresa</dt><dd>'+esc(x.empresa)+'</dd><dt>Emitido em</dt><dd>'+new Date(x.emitidoEm).toLocaleDateString('pt-BR')+'</dd><dt>Plataforma</dt><dd>Clique Certo · Ativa Security</dd></dl>';return;}
 const tp=x.tipo==='participacao'?'Certificado de participação':'Certificado de conclusão';o.innerHTML='<p class="ok"><b>✓ Certificado válido</b></p>'+(x.demo?'<p class="err">Empresa de demonstração (dados fictícios).</p>':'')+'<dl><dt>Tipo</dt><dd>'+tp+'</dd><dt>Empresa</dt><dd>'+esc(x.empresa)+'</dd><dt>Nível</dt><dd>'+esc(x.nivel)+'</dd><dt>Conclusão</dt><dd>'+esc(x.pct)+'% ('+esc(x.concluidos)+' de '+esc(x.ativos)+' funcionários ativos)</dd><dt>Emitido em</dt><dd>'+new Date(x.emitidoEm).toLocaleDateString('pt-BR')+'</dd>'+(x.tipo==='conclusao'&&x.acertoPos!=null?'<dt>Acerto médio no pós-teste</dt><dd>'+esc(x.acertoPos)+'%</dd>':'')+'<dt>Emitido por</dt><dd>Ativa Security</dd></dl>';}
 catch(e){o.innerHTML='<p class="err">Não foi possível verificar agora.</p>';}}
$('#ver').onclick=ver;$('#cod').onkeydown=e=>{if(e.key==='Enter')ver();};const h=location.hash.slice(1);if(h){$('#cod').value=h;ver();}
</script></body></html>
